version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: jaskirat_postgres
    environment:
      POSTGRES_DB: jaskirat_db
      POSTGRES_USER: jaskirat
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jaskirat -d jaskirat_db" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # FastAPI Application
  api:
    build: .
    container_name: jaskirat_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://jaskirat:password@postgres:5432/jaskirat_db
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=true
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Redis (for future caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: jaskirat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # pgAdmin (Database Administration)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jaskirat_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jaskirat.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
